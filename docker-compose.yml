version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: chargeloop-postgres
    restart: always
    environment:
      POSTGRES_DB: chargeloop_db
      POSTGRES_USER: chargeloop_admin
      POSTGRES_PASSWORD: chargeloop_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: chargeloop-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
